[project]
name = "internfly"
version = "0.1.0"
description = "A durable, scientifically honest fruit-fly internship agent simulation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
connectome = [
  "neuprint-python>=0.5.1,<1",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["internfly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "internfly.api:app"
